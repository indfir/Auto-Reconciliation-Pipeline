<rect x="40" y="470" width="1020" height="56" rx="10" fill="#101828" stroke="#1f2a3d"/>
<text x="60" y="493" fill="#e6edf6" font-size="12.5" font-weight="500">Shipped as two synchronised builds</text>
<text x="60" y="512" fill="#8b9bb4" font-size="11.5">Flask (localhost) and Google Apps Script (web app) — identical features, one codebase discipline</text>
<text x="640" y="493" fill="#34d399" font-size="12.5" font-weight="500" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">./deploy.sh</text>
<text x="640" y="512" fill="#8b9bb4" font-size="11.5">change detection → semantic version bump → changelog → push → stable URL</text>
</svg>
