<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" role="img" aria-labelledby="rccTitle rccDesc" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
<title id="rccTitle">Recon Control Center — system data flow</title>
<desc id="rccDesc">Issuer and bank files are formatted by Apps Script into Cloud Storage and BigQuery. The Recon Control Center reads Google Drive, BigQuery and Cloud Storage, and serves eight operational tabs with an AI summary layer, CSV export and an audit log. The same application ships as two synchronised builds, Flask and Google Apps Script, released by a one-command deploy.</desc>

<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#3f5170"/>
</marker>
<marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#38bdf8"/>
</marker>
</defs>

<rect width="1100" height="560" rx="16" fill="#0b0f17"/>

<text x="40" y="46" fill="#38bdf8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="2">RECON CONTROL CENTER</text>
<text x="40" y="70" fill="#8b9bb4" font-size="13.5">Daily payment reconciliation — from raw issuer files to a single operational console</text>

<g font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="1.5" fill="#5d6e8a">
<text x="40" y="112">SOURCES</text>
<text x="320" y="112">PIPELINE</text>
<text x="600" y="112">CONTROL CENTER</text>
<text x="905" y="112">DELIVERED TO</text>
</g>

<g>
<rect x="40" y="128" width="216" height="60" rx="10" fill="#131a28" stroke="#1f2a3d"/>
<text x="58" y="152" fill="#e6edf6" font-size="13.5" font-weight="500">Issuer files · 12 issuers</text>
<text x="58" y="172" fill="#8b9bb4" font-size="11.5">Google Drive — email &amp; portal drops</text>

<rect x="40" y="200" width="216" height="60" rx="10" fill="#131a28" stroke="#1f2a3d"/>
<text x="58" y="224" fill="#e6edf6" font-size="13.5" font-weight="500">Bank statements · 4 banks</text>
<text x="58" y="244" fill="#8b9bb4" font-size="11.5">Scheduled Tue / Fri, twice a day</text>

<rect x="40" y="272" width="216" height="60" rx="10" fill="#131a28" stroke="#1f2a3d"/>
<text x="58" y="296" fill="#e6edf6" font-size="13.5" font-weight="500">YTI settlement</text>
<text x="58" y="316" fill="#8b9bb4" font-size="11.5">Hourly transaction feed</text>
</g>

<g>
<rect x="320" y="128" width="216" height="86" rx="10" fill="#131a28" stroke="#1f2a3d"/>
<text x="338" y="152" fill="#e6edf6" font-size="13.5" font-weight="500">Apps Script formatting</text>
<text x="338" y="172" fill="#8b9bb4" font-size="11.5">Per-issuer normalisation,</text>
<text x="338" y="188" fill="#8b9bb4" font-size="11.5">2 batches · 2 cycles daily</text>
<text x="338" y="204" fill="#34d399" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">→ RAW DATA / date</text>

<rect x="320" y="226" width="216" height="60" rx="10" fill="#131a28" stroke="#1f2a3d"/>
<text x="338" y="250" fill="#e6edf6" font-size="13.5" font-weight="500">Airflow ingestion</text>
<text x="338" y="270" fill="#8b9bb4" font-size="11.5">18 parallel tasks · hourly · ~53s</text>

<rect x="320" y="298" width="216" height="86" rx="10" fill="#131a28" stroke="#1f2a3d"/>
<text x="338" y="322" fill="#e6edf6" font-size="13.5" font-weight="500">BigQuery reconciliation</text>
<text x="338" y="342" fill="#8b9bb4" font-size="11.5">Two-way matching:</text>
<text x="338" y="358" fill="#8b9bb4" font-size="11.5">YTI → Issuer and Issuer → YTI</text>
<text x="338" y="374" fill="#34d399" font-size="11.5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">+ Cloud Run report jobs</text>
</g>

<rect x="600" y="128" width="256" height="332" rx="14" fill="#101828" stroke="#38bdf8" stroke-opacity=".45"/>
<text x="620" y="154" fill="#38bdf8" font-size="14" font-weight="600">Recon Control Center</text>
<text x="620" y="174" fill="#8b9bb4" font-size="11.5">One console over three data stores</text>

<g font-size="11.5">
<rect x="618" y="188" width="220" height="40" rx="8" fill="#131a28" stroke="#1f2a3d"/>
<text x="632" y="204" fill="#e6edf6" font-weight="500">Reads Drive · BigQuery · GCS</text>
<text x="632" y="220" fill="#8b9bb4">upload checks, recon, settlement xlsx</text>

<rect x="618" y="236" width="220" height="40" rx="8" fill="#131a28" stroke="#1f2a3d"/>
<text x="632" y="252" fill="#e6edf6" font-weight="500">Pipeline runner</text>
<text x="632" y="268" fill="#8b9bb4">per issuer, per batch, live progress</text>

<rect x="618" y="284" width="220" height="40" rx="8" fill="#131a28" stroke="#1f2a3d"/>
<text x="632" y="300" fill="#e6edf6" font-weight="500">Fast xlsx parser</text>
<text x="632" y="316" fill="#8b9bb4">regex over unzipped sheets — 45s → &lt;3s</text>

<rect x="618" y="332" width="220" height="40" rx="8" fill="#131a28" stroke="#1f2a3d"/>
<text x="632" y="348" fill="#e6edf6" font-weight="500">Auth · roles · audit log</text>
<text x="632" y="364" fill="#8b9bb4">rate limiting, idle sign-out, redaction</text>

<rect x="618" y="380" width="220" height="62" rx="8" fill="#131a28" stroke="#818cf8" stroke-opacity=".5"/>
<text x="632" y="396" fill="#818cf8" font-weight="500">AI summary layer</text>
<text x="632" y="412" fill="#8b9bb4">Qwen · OpenAI · Claude, switchable</text>
<text x="632" y="428" fill="#8b9bb4">aggregates only · token accounting</text>
</g>

<g>
<rect x="900" y="128" width="160" height="60" rx="10" fill="#131a28" stroke="#1f2a3d"/>
<text x="916" y="152" fill="#e6edf6" font-size="13" font-weight="500">8 operational tabs</text>
<text x="916" y="172" fill="#8b9bb4" font-size="11.5">Ops · Finance · BI</text>

<rect x="900" y="200" width="160" height="60" rx="10" fill="#131a28" stroke="#1f2a3d"/>
<text x="916" y="224" fill="#e6edf6" font-size="13" font-weight="500">Drill-down + CSV</text>
<text x="916" y="244" fill="#8b9bb4" font-size="11.5">per issuer, per date</text>

<rect x="900" y="272" width="160" height="60" rx="10" fill="#131a28" stroke="#1f2a3d"/>
<text x="916" y="296" fill="#e6edf6" font-size="13" font-weight="500">Daily AI briefing</text>
<text x="916" y="316" fill="#8b9bb4" font-size="11.5">gaps named per date</text>

<rect x="900" y="344" width="160" height="60" rx="10" fill="#131a28" stroke="#1f2a3d"/>
<text x="916" y="368" fill="#e6edf6" font-size="13" font-weight="500">Teams reports</text>
<text x="916" y="388" fill="#8b9bb4" font-size="11.5">scheduled summaries</text>
</g>

